[package]
name = "agentmond"
version = "0.1.0"
edition = "2024"

[dependencies]
agentmon-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
