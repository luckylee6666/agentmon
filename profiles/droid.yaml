data_dirs:
  - "~/.factory"
config_files:
  - "~/.factory/config.json"
allowed_domains:
  - "*.factory.ai"
  - "factory.ai"
  - "app.factory.ai"
telemetry_domains:
  - "*.sentry.io"
notes: ""
