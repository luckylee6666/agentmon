id: trae
name: Trae
vendor: ByteDance
process:
  names: [Trae, trae]
  exe:
    - "**/Trae.app/Contents/MacOS/**"
    - "**/trae"
data_dirs:
  - "~/Library/Application Support/Trae"
  - "~/.trae"
allowed_domains:
